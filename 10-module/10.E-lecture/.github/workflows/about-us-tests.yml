name: About Us Tests

on:
  push:
    branches: [develop, main]
    paths:
      - 'tests/about-us-tests.spec.ts'
      - 'page-objects/AboutUsPage.ts'
      - 'fixtures/global.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [develop, main]
    paths:
      - 'tests/about-us-tests.spec.ts'
      - 'page-objects/AboutUsPage.ts'
      - 'fixtures/global.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run About Us Tests
        run: npx playwright test tests/about-us-tests.spec.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
